name: Aplicar ajuste responsivo do rodapé

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-footer-layout-patch.yml"
      - "scripts/apply-footer-layout-patch.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alterações
        run: node scripts/apply-footer-layout-patch.mjs

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css index.html style.css
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Refina diagramação do rodapé em desktop e mobile"
          git push
